[project]
name = "bookworm-experiments"
version = "1.0.0"
description = "Experiments, analyses and reproducible artifacts of bookworm on the PublicHearingBR dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "bookworm[embeddings,profiles]",
    "accelerate>=1.15.0",
    "huggingface-hub>=1.24.0",
    "jinja2>=3.1.6",
    "laya==0.3.11",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "protobuf>=7.36.2",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sentence-transformers>=5.6.1",
    "sentencepiece>=0.2.2",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "experiments"

[tool.uv.sources]
bookworm = { path = "../bookworm", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/experiments/common/cache_lock.py" = ["SIM115"]
"tests/test_cache_lock.py" = ["SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["experiments"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["laya", "laya.*", "scipy", "scipy.*", "sklearn", "sklearn.*", "tokenizers", "tokenizers.*", "yaml", "mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "rank_bm25"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
