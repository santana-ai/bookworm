[dataset]
lds_path = "dataset/PublicHearingBR_LDS.jsonl"
lds_sha256 = "c4e392ab95ce22f6228eace16f15e9efe1c846724846b873dec420aec3d872c0"

[splits]
manifest_path = "artifacts/splits/temporal_v1.json"
use = ["train", "validation"]
test_policy = "test is never read unless --final-test is passed; nothing in this experiment is fitted or chosen, thresholds are only swept and reported"

[reference]
udv_runs = ["artifacts/udv/udv_v1_pre", "artifacts/udv/udv_v0"]
selection_rule = "first run in the list whose <run>.jsonl and <run>_coverage.json both exist; the evidence of its semantic records is the production encoder's top-1 sentence"

[encoder_baseline]
udv_config_path = "configs/udv.toml"
cache_device_label = "mps"
rule = "the production run writes per-hearing embeddings keyed by encoder name, revision and device label; this experiment only reads those files (cosine argmax per opinion over the person's sentences, first index on ties, as in build_udvs) and never encodes, so it runs on CPU; a hearing without cached files is counted and left out of the baseline"

[quotes]
prefix_word_levels = [10, 6]
min_prefix_words = 6
prefix_rule = "same prefixes as the exact pipeline: the first min(level, len(words)) whitespace words of each extracted quote, kept only with min_prefix_words or more; levels are tried in order, as in the exact cascade"
text_folding = "per character: accents stripped and lowercased, a character whose folded form is not one character keeps its lowercase or original form, so offsets in the folded text are offsets in the whitespace-normalized turn text"
char_scorer = "rapidfuzz.fuzz.partial_ratio_alignment(folded prefix, folded turn text); when the turn is shorter than the prefix, rapidfuzz.fuzz.ratio over the whole turn"
token_scorer = "rapidfuzz.fuzz.partial_ratio_alignment over lists of \\w+ tokens of the folded texts; for a window of the same length this equals 100 * in-order matched words / prefix tokens; when the turn has fewer tokens than the prefix, rapidfuzz.fuzz.ratio over the whole turn"
search_unit = "each matched turn of the person separately"
thresholds = [80, 82, 84, 86, 88, 90, 92, 94, 96, 98, 100]
null_draws_per_opinion = 5
null_rule = "each draw takes as many eligible quotes as the opinion has, from the pool, without replacement, and aligns them against the same person's turns; same_hearing_other_person draws quotes of other participants of the same hearing (topic-matched, may contain real repetitions), other_hearing_same_split draws quotes of other hearings of the same split"
review_min_score = 80
score_bin_width = 5

[names]
metrics = ["token_set_ratio", "jaro_winkler"]
name_normalization = "udv_pipeline.normalize_name (accents stripped, uppercase), then only \\w+ tokens joined by one space"
token_set_ratio = "rapidfuzz.fuzz.token_set_ratio, 0 to 100"
jaro_winkler = "100 * rapidfuzz.distance.JaroWinkler.normalized_similarity, default prefix_weight 0.1"
speaker_definition = "each distinct normalized turn name candidate (udv_pipeline.turn_name_candidates) of the hearing, with the set of turns that carry it"
second_best_rule = "highest-scoring speaker whose turn set is disjoint from the best speaker's, so aliases of the same turns are not rivals"
thresholds = [80, 82, 84, 86, 88, 90, 92, 94, 96, 98, 100]
review_min_score = 80
speech_excerpt_chars = 300
impostor_examples = 25

[review]
context_chars = 300
item_prefixes = { quotes = "FQ", names = "FN" }
order_streams = { quotes = [2, 0], names = [2, 1] }
blinding_rule = "the review sheets <run>_quotes_review.jsonl and <run>_names_review.jsonl show only what a judgment needs. Quotes: hearing_id, participant, role, opinion, its extracted quotes, the turn header and the candidate passage with context_chars of context on each side inside the turn; one row per distinct candidate passage of an opinion, every method and prefix level that proposed it merged into that row. Names: hearing_id, participant, role and opinions, and the candidate speaker's header name, party information, turn count and first speech excerpt; one row per distinct candidate speaker of a participant. Rows are in a seeded random order and item ids follow that order. Method, prefix level, prefix, score, encoder agreement, encoder tier and support type, exact short-quote match, scores in other speakers' turns, split, metric ranks and scores, assignment to a resolved participant and quote support are written only to the matching <run>_*_review_key.json. The reviewer opens only the two sheets and the transcripts, never the keys, <run>_quotes.jsonl, <run>_names.jsonl or the report files"
known_leaks = [
  "rows that share an opinion (or a participant) are separate rows, so the reviewer can count how many distinct candidates were proposed for it; an opinion with a single row had every method and prefix level at the same passage",
  "every quote row has at least one proposal scoring quotes.review_min_score or more, and every name row belongs to a participant whose best candidate scores names.review_min_score or more under some metric, so the sheets hold only proposals above those floors",
  "hearing_id is shown so the transcript can be opened; the split is not shown, but it follows from hearing_id through the split manifest",
]
filled_sheet_rule = "a review sheet with a judgment on any row is never overwritten: rerunning the experiment stops before writing anything"

[review.quotes]
labels = ["match", "no_match", "unsure"]
positive_label = "match"
unsure_label = "unsure"
label_definitions = { match = "one of the opinion's quotations starts in the candidate passage: its first words are there, allowing differences of spelling, accents, punctuation or a few words", no_match = "no quotation of the opinion starts in the candidate passage", unsure = "the passage and its context do not allow a decision" }

[review.names]
labels = ["same_person", "different_person", "unsure"]
positive_label = "same_person"
unsure_label = "unsure"
label_definitions = { same_person = "the candidate speaker is the participant (the name, role, party information and speech fit, allowing spelling variants of the name)", different_person = "the candidate speaker is someone else", unsure = "the sheet does not allow a decision" }

[review.precision]
output_suffix = "review_precision_report"
precision_rule = "utils.fuzzy_review_precision joins each filled sheet with its key and the rows file the key was built from (sha256 checked). Quotes: for each method and threshold, the gains of that threshold (first prefix level reaching it, as in the gains section) inherit the judgment of the row that shows their candidate passage; bands take the gains of a threshold that the next threshold does not keep. Names: for each rule and threshold, the participants that rule would resolve (status unique and not contested) inherit the judgment of the row of their best speaker. precision = positive / (positive + negative), unsure left out; precision_unsure_as_error counts unsure as errors; intervals resample the hearings that contribute accepted items, whole; the Wilson interval ignores the hearing clustering and is given for reference only. The report is computed only when every row of both sheets has a valid judgment, so no precision number is seen during the review"

[bootstrap]
unit = "hearing"
samples = 1000
confidence_level = 0.95

[run]
version = "fuzzy_v1"
seed = 42
output_dir = "artifacts/experiments/fuzzy"
