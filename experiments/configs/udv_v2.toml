[dataset]
lds_path = "dataset/PublicHearingBR_LDS.jsonl"
sha256 = "c4e392ab95ce22f6228eace16f15e9efe1c846724846b873dec420aec3d872c0"

[encoder]
name = "PORTULAN/serafim-335m-portuguese-pt-sentence-encoder"
revision = "a01887015444f7599669c509447c5bdbce958916"
batch_size = 64
device = "auto"

[evidence]
embedding_threshold = 0.5
semantic_unit = "window2"
quote_extent = "full_quote"
calibration_source = "artifacts/calibration/threshold_v2.json"
threshold_decision = "legacy_random of utils.calibrate_udv_v2 cosine on window2 units of the 144 train hearings: rules.legacy_random.threshold 0.5015 (hearing bootstrap 95% CI 0.4858 to 0.5129), rounded to 0.50; artifacts/calibration/threshold_v2.json"
previous_embedding_threshold = 0.45
unit_decision = "window2 of E2 (retrieval_v1_report.json, train and validation only): the only unit kind that beats sentence on acc_at_1_minus_random with Holm p < 0.05 on one benchmark in both train and validation (masked_quotes: +0.097, Holm 0.007, and +0.179, Holm 0.017) and is never significantly worse than sentence (nli: +0.007 and +0.014, Holm 0.25 and 0.41); window3 is worse than sentence on nli train (-0.020, Holm 0.019). See bookworm/docs/adr/0006-udv-v2-windows-full-quotes-and-verifier.md"
quote_extent_rule = "trusted matches only: the evidence covers the sentence parts of the source turn from the prefix start to the end of the longest quote suffix of 6, 4 or 3 words found after the prefix within 2 x quote length characters; without a suffix, as many sentence parts as the quote has, from the prefix sentence on; never outside the turn"

[run]
seed = 42
output_dir = "artifacts/udv"
cache_dir = "artifacts/cache/embeddings"

[calibration]
version = "threshold_v2"
unit = "window2"
splits = ["train"]
manifest_path = "artifacts/splits/temporal_v1.json"
masked_benchmark_path = "artifacts/benchmarks/masked_quotes_v1.jsonl"
output_dir = "artifacts/calibration"
primary_rule = "masked_top1_youden"
primary_rule_declaration = "The udv_v1 declaration (configs/udv.toml, 2026-09-22) is kept for the report layout: masked_top1_youden is computed and reported. It does not choose the udv_v2 cut; adopted_rule does."
adopted_rule = "legacy_random"
adopted_rule_declaration = "Declared on 2026-09-28 in ADR 0006, before any window cosine of a calibration pair was computed: the udv_v2 cut is the legacy_random rule, the rule udv_v1 adopted, recomputed on window units of train hearings only; hard_negative, masked_hard_negative and masked_top1_youden are reported for comparison."
seed = 42
bootstrap_samples = 1000
bootstrap_unit = "hearing"
bootstrap_unit_reason = "opinions of the same hearing share speakers, topic and transcript, so they are not independent; each bootstrap replicate resamples whole hearings and redraws the random negatives"
confidence_level = 0.95
negatives_per_query = 1
positive_quantile = 0.25
negative_quantile = 0.75
threshold_decimals = 2

[verifier_calibration]
version = "udv_verifier_threshold_v1"
score = "primary_probability of laya_en_en:learned_cross_model_with_pt (E3x v2 final test), refitted on the NLI benchmark train split by utils.udv_verifier apply"
scores_path = "artifacts/calibration/threshold_v2_verifier_scores.jsonl"
output_path = "artifacts/calibration/udv_verifier_threshold_v1.json"
train_threshold = 0.7478
adopted_rule = "legacy_random"
declaration = "Declared on 2026-09-28 in ADR 0006, before any verifier score of a calibration pair was computed: the UDV-premise cut is the midpoint of the 0.25 quantile of the primary probability on the positive pairs of threshold_v2 and the 0.75 quantile on their legacy_random negatives, train hearings only; the hard_negative variant is reported and not adopted."
