runs_dir: mlx_alternative/runs
models_dir: ~/.lmstudio/models
env_file: mlx_alternative/.env

models:
  gemma4_31b:
    repo: lmstudio-community/gemma-4-31B-it-MLX-8bit
    description: Gemma 4 31B instruct, dense, 8-bit MLX
    chat_template_kwargs:
      enable_thinking: false
  qwen38_27b:
    repo: mlx-community/Qwen3.8-27B-8bit
    description: Qwen3.8 27B, dense with hybrid attention, 8-bit MLX
    chat_template_kwargs:
      enable_thinking: false
  gemma4_26b_a4b:
    repo: mlx-community/gemma-4-26b-a4b-it-8bit
    description: Gemma 4 26B-A4B instruct, mixture of experts (about 4B active), 8-bit MLX
    chat_template_kwargs:
      enable_thinking: false

backend:
  prefix_cache: false
  prefill_step: 2048

short_run:
  actors:
    - Arnaldo Jardim
    - Daniela Reinehr

benchmark:
  long_context_actor: null
  generation_tokens: 128
  profile_output_tokens_guess: 1200
