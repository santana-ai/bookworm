[dataset]
lds_path = "dataset/PublicHearingBR_LDS.jsonl"
lds_sha256 = "c4e392ab95ce22f6228eace16f15e9efe1c846724846b873dec420aec3d872c0"

[splits]
manifest_path = "artifacts/splits/temporal_v1.json"
default = ["train", "validation"]

[benchmarks.masked_quotes]
path = "artifacts/benchmarks/masked_quotes_v1.jsonl"
query_field = "masked_opinion"
candidates = "the row's candidate list (the speaker's per-turn sentences), checked against the list rebuilt from the LDS with resolve_hearing_people"
relevance = "a unit is relevant when it contains a sentence listed in target_indices (the sentences that agree with the silver target sentence enclosing the trusted quote prefix)"

[benchmarks.nli]
path = "artifacts/benchmarks/nli_v1.jsonl"
query_field = "opinion"
filters = ["label_inferable is true", "person resolved to LDS turns", "at least one located chunk", "at least one sentence unit of the speaker overlaps a located chunk segment"]
candidates = "rebuilt from person_resolution.turn_indices with split_into_turns and split_sentences on each turn, the resolution rechecked with resolve_person_speech on the NLI person name"
relevance = "a unit is relevant when its character span overlaps the recorded span (chosen occurrence) of any segment of any located chunk of the opinion; the label says the opinion was judged inferable from the four retrieved chunks together (retrieved_context_entailment), not that each overlapping unit supports it"

[units]
kinds = ["sentence", "window2", "window3", "turn"]
window_sizes = { window2 = 2, window3 = 3 }
stride = 1
definitions = "sentence: one candidate sentence; windowN: N consecutive candidate sentences of one turn, stride 1, a turn with fewer than N sentences gives one unit with all of them, text joined by a space, span from the first sentence start to the last sentence end; turn: the whole turn text (whitespace normalized, including stage directions and parts shorter than a sentence), only turns with at least one candidate sentence"

[retrievers.tfidf_word]
kind = "tfidf"
fit_scopes = ["speaker", "hearing"]
analyzer = "word"
ngram_range = [1, 1]
lowercase = true
strip_accents = "unicode"
token_pattern = "(?u)\\b\\w\\w+\\b"
sublinear_tf = false
min_df = 1

[retrievers.tfidf_char]
kind = "tfidf"
fit_scopes = ["speaker", "hearing"]
analyzer = "char_wb"
ngram_range = [3, 5]
lowercase = true
strip_accents = "unicode"
token_pattern = "(?u)\\b\\w\\w+\\b"
sublinear_tf = false
min_df = 1

[retrievers.bm25]
kind = "bm25"
fit_scopes = ["speaker", "hearing"]
k1 = 1.5
b = 0.75
epsilon = 0.25

[retrievers.serafim_335m]
kind = "dense"
model = "PORTULAN/serafim-335m-portuguese-pt-sentence-encoder"
revision = "a01887015444f7599669c509447c5bdbce958916"
query_prefix = ""
passage_prefix = ""
max_seq_length = 128
batch_size = 32
token_budget = 4096
production_cache = true
card_notes = "config_sentence_transformers.json: prompts {} and default_prompt_name null, so no prefix; modules: Transformer (BertModel, hidden 1024) + mean Pooling, no Normalize module; sentence_bert_config.json max_seq_length 128 (production value, kept so vectors equal the build_udvs cache); trained with AnglELoss on STS."

[retrievers.serafim_335m_ir]
kind = "dense"
model = "PORTULAN/serafim-335m-portuguese-pt-sentence-encoder-ir"
revision = "222eaea5c8df6b61d8032ffffaa9bc9febd35a2e"
query_prefix = ""
passage_prefix = ""
max_seq_length = 128
batch_size = 32
token_budget = 4096
production_cache = false
card_notes = "prompts {} and default_prompt_name null, no prefix in the card usage; Transformer (BertModel, 1024) + mean Pooling, no Normalize; max_seq_length 128; train-config.yaml: GISTEmbedLoss on unicamp-dl/mmarco portuguese pairs, base bertimbau-335m."

[retrievers.serafim_900m]
kind = "dense"
model = "PORTULAN/serafim-900m-portuguese-pt-sentence-encoder"
revision = "8b6aac1431bf56dd4b8f6a27a98ea78d3a7c5d31"
query_prefix = ""
passage_prefix = ""
max_seq_length = 128
batch_size = 16
token_budget = 2048
production_cache = false
card_notes = "prompts {} and default_prompt_name null, no prefix; Transformer (DebertaV2Model, hidden 1536) + mean Pooling, no Normalize; max_seq_length 128; train-config.yaml base albertina-900m-ptpt (European Portuguese base), CoSENT on STS."

[retrievers.e5_large]
kind = "dense"
model = "intfloat/multilingual-e5-large"
revision = "3d7cfbdacd47fdda877c5cd8a79fbcc4f2a574f3"
query_prefix = "query: "
passage_prefix = "passage: "
max_seq_length = 512
batch_size = 16
token_budget = 8192
production_cache = false
card_notes = "README: each input must start with 'query: ' or 'passage: '; 'query: '/'passage: ' for asymmetric passage retrieval, 'query: ' on both sides for symmetric similarity; the asymmetric pair is used because the query (an opinion summary) and the passages (transcript speech) differ in length and register. No config_sentence_transformers.json prompts in the snapshot, so the prefixes are prepended to the text here. Modules: XLMRobertaModel (1024) + mean Pooling + Normalize; max_seq_length 512."

[retrievers.bge_m3]
kind = "dense"
model = "BAAI/bge-m3"
revision = "5617a9f61b028005a4858fdac845db406aefb181"
query_prefix = ""
passage_prefix = ""
max_seq_length = 8192
batch_size = 8
token_budget = 8192
production_cache = false
card_notes = "README: 'the BGE-M3 model no longer requires adding instructions to the queries'; dense vectors from sentence-transformers: XLMRobertaModel (1024) + CLS Pooling + Normalize; max_seq_length 8192 (native, kept; a batch never exceeds token_budget tokens, so one 8192-token sequence runs alone). Sparse and ColBERT heads (sparse_linear.pt, colbert_linear.pt) are not used."

[retrievers.mpnet]
kind = "dense"
model = "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
revision = "4328cf26390c98c5e3c738b4460a05b95f4911f5"
query_prefix = ""
passage_prefix = ""
max_seq_length = 128
batch_size = 32
token_budget = 4096
production_cache = false
card_notes = "no prompts in config_sentence_transformers.json and no prefix in the card; XLMRobertaModel (768) + mean Pooling, no Normalize; max_seq_length 128; paraphrase model (symmetric)."

[retrievers.minilm]
kind = "dense"
model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
revision = "e8f8c211226b894fcb81acc59f3b34ba3efd5f42"
query_prefix = ""
passage_prefix = ""
max_seq_length = 128
batch_size = 32
token_budget = 4096
production_cache = false
card_notes = "no prompts and no prefix; BertModel (384) + mean Pooling, no Normalize; max_seq_length 128; paraphrase model (symmetric)."

[retrievers.hybrid_rrf]
kind = "rrf"
components = ["bm25_speaker", "serafim_335m"]
k = 60
choice = "declared before any retrieval result was computed: BM25 fitted on the speaker's units (the sparse design the benchmarks were built around) fused with the production encoder, so the hybrid measures what lexical evidence adds to the encoder already in use; another dense component may only be chosen on train"

[retrievers.rerank_bge]
kind = "rerank"
model = "BAAI/bge-reranker-v2-m3"
revision = "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
base = "serafim_335m"
top_k = 20
max_length = 512
batch_size = 16
card_notes = "config.json: XLMRobertaForSequenceClassification with id2label {0: LABEL_0}, a single relevance logit (higher = more relevant), no sbert_ce_default_activation_function; README scores with max_length=512 and maps to [0, 1] with sigmoid only optionally. The raw logit is used (activation Identity), which gives the same order as the sigmoid without saturated ties. No query instruction for this normal (non-LLM) reranker."

[retrievers.rerank_mmarco]
kind = "rerank"
model = "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
revision = "1427fd652930e4ba29e8149678df786c240d8825"
base = "serafim_335m"
top_k = 20
max_length = 512
batch_size = 32
card_notes = "config.json: XLMRobertaForSequenceClassification, id2label {0: LABEL_0}, a single logit, sbert_ce_default_activation_function Identity; tokenizer model_max_length 512; trained on machine-translated mMARCO (includes pt)."

[evaluation]
baseline_retriever = "serafim_335m"
baseline_unit = "sentence"
ks = [1, 3, 5]
top_n_stored = 10
score_decimals = 5
bootstrap_samples = 2000
permutation_samples = 10000
confidence_level = 0.95
seed = 42
bootstrap_unit = "hearing"
multiple_comparisons = "holm, one family per question: E1 (retrievers) compares every retriever with baseline_retriever on the same unit kind, one family per benchmark, split group, unit kind and test (McNemar on acc@1, sign-flip on reciprocal rank); E2 (units) compares every unit kind with baseline_unit for the same retriever on the paired lift (hit@1 minus n_relevant / n_units), one family per benchmark, split group and retriever; no test crosses both the retriever and the unit kind, and every adjusted p-value records its family"
multiple_comparisons_amendment = "Recorded on 2026-09-23, before any summarize run that included a dense retriever: the first version tested every (retriever, unit) pair against serafim_335m on sentences with raw acc@1 and MRR in one family per benchmark and split group, which mixed the retriever and unit questions and rewarded larger units for their higher chance of holding a relevant unit (random_acc_at_1 0.015 on B1 sentences vs 0.455 on B1 turns; 1,365 of 3,222 B2 turn queries have every unit relevant); the only summarize report written before this change (retrieval_v1_report.json of the sparse run) had no baseline rows, so no comparison had been computed"
tie_policy = "order by score descending, candidate index ascending on ties (the argmax rule of the UDV builder); rank_optimistic and rank_pessimistic bound the rank of the first relevant unit over every tie order"

[cache]
embeddings_dir = "artifacts/cache/experiments/embeddings"
rerank_dir = "artifacts/cache/experiments/rerank"
shard_size = 5000
batch_size_note = "batch sizes measured on 2026-09-22 (Apple M5, MPS, fp32, serafim-335m, 512 sentences): 16 to 32 give about 2.1k tokens/s, 64 about 1.0k and 256 about 0.55k; the batch size changes vectors only at float rounding level"
production_config = "configs/udv.toml"

[run]
run_name = "retrieval_v1"
output_dir = "artifacts/experiments/retrieval"
device = "auto"
hf_hub_offline = true
seed = 42

[queue]
plan = "priority order under the measured MPS throughput: every retriever on the sentence unit (E1) and the turn unit, the four units (E2) for the production encoder, the hybrid and the small reranker; windows for other dense models and the large reranker beyond sentences are left for a later step chosen on train"
steps = [
    { retrievers = ["tfidf_word", "tfidf_char", "bm25"], units = ["sentence", "window2", "window3", "turn"], device = "cpu" },
    { retrievers = ["serafim_335m"], units = ["sentence", "window2", "window3", "turn"] },
    { retrievers = ["hybrid_rrf"], units = ["sentence", "window2", "window3", "turn"] },
    { retrievers = ["minilm"], units = ["sentence", "turn"] },
    { retrievers = ["mpnet"], units = ["sentence", "turn"] },
    { retrievers = ["serafim_335m_ir"], units = ["sentence", "turn"] },
    { retrievers = ["e5_large"], units = ["sentence", "turn"] },
    { retrievers = ["rerank_mmarco"], units = ["sentence", "window2", "window3", "turn"] },
    { retrievers = ["rerank_bge"], units = ["sentence"] },
    { retrievers = ["bge_m3"], units = ["sentence", "turn"] },
    { retrievers = ["serafim_900m"], units = ["sentence", "turn"] },
]
