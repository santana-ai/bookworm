[dataset]
lds_path = "dataset/PublicHearingBR_LDS.jsonl"
sha256 = "c4e392ab95ce22f6228eace16f15e9efe1c846724846b873dec420aec3d872c0"

[encoder]
name = "PORTULAN/serafim-335m-portuguese-pt-sentence-encoder"
revision = "a01887015444f7599669c509447c5bdbce958916"
batch_size = 64
device = "auto"

[evidence]
embedding_threshold = 0.47
calibration_source = "udv_v05.ipynb"
calibration_records = 20
calibration_pairs = 35
calibration_method = "pairs confirmed by a case-insensitive quote prefix of 6+ words vs random pairs, midpoint of q25(positive) and q75(negative)"

[run]
seed = 42
output_dir = "artifacts/udv"
cache_dir = "artifacts/cache/embeddings"
